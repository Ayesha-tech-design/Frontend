<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users Management | SmartEduX</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --primary: #0b2149;
  }
</style>

</head>

<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

<!-- HEADER -->
<header class="bg-[#0b2149] text-white shadow">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
    <h1 class="text-xl font-bold tracking-tight text-center sm:text-left">Users Management</h1>

    <button onclick="window.location.href='admin-dashboard.html'"
      class="bg-white text-[#0b2149] px-4 py-2 rounded-lg font-medium hover:bg-gray-200 transition text-sm">
      Back to Dashboard
    </button>
  </div>
</header>

<!-- MAIN -->
<main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex-grow">

  <!-- TOP CONTROLS -->
  <div class="flex flex-col sm:flex-row justify-between gap-4 mb-6">
    <!-- SEARCH -->
    <div class="w-full sm:w-1/2 lg:w-1/3">
      <input id="searchInput" type="text" placeholder="Search by name or email..."
        class="w-full p-3 rounded-lg border bg-white focus:ring-2 focus:ring-[#0b2149] outline-none text-sm sm:text-base">
    </div>

    <!-- FILTER -->
    <div class="w-full sm:w-auto">
      <select id="roleFilter"
        class="w-full sm:w-auto p-3 rounded-lg border bg-white focus:ring-2 focus:ring-[#0b2149] outline-none text-sm sm:text-base">
        <option value="all">All Users</option>
        <option value="Student">Students</option>
        <option value="Teacher">Teachers</option>
        <option value="Admin">Admins</option>
      </select>
    </div>
  </div>

  <!-- USERS TABLE CONTAINER -->
  <div class="bg-white shadow-lg rounded-xl overflow-hidden border border-gray-200">
    <div class="overflow-x-auto w-full">
      <table class="w-full text-left border-collapse min-w-[600px]">
        <thead class="bg-[#0b2149] text-white">
          <tr>
            <th class="p-4 text-sm sm:text-base font-semibold">Name</th>
            <th class="p-4 text-sm sm:text-base font-semibold">Email</th>
            <th class="p-4 text-sm sm:text-base font-semibold">Role</th>
            <th class="p-4 text-sm sm:text-base font-semibold">Status</th>
            <th class="p-4 text-sm sm:text-base font-semibold">Action</th>
          </tr>
        </thead>

        <tbody id="userTable" class="text-gray-700 divide-y divide-gray-100">
          <!-- JS dynamic content -->
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- JS -->
<script src="connection.js"></script>
<script>
let users = [];

const table = document.getElementById("userTable");
const searchInput = document.getElementById("searchInput");
const roleFilter = document.getElementById("roleFilter");

// 1. Backend se users fetch karne ka function
async function fetchUsers() {
  try {
    // Apne backend ka endpoint yahan dein jahan se users ki list milti hai
    const data = await apiRequest("/users/", "GET"); 
    if (data) {
      users = data; // Backend se aane wala data array yahan save ho jayega
      renderUsers();
    }
  } catch (err) {
    console.error("Failed to load users from backend", err);
    table.innerHTML = `
      <tr>
        <td colspan="5" class="p-6 text-center text-red-500 italic">Failed to load users from server.</td>
      </tr>
    `;
  }
}

function renderUsers() {
  if (!table) return;
  table.innerHTML = "";

  const search = searchInput ? searchInput.value.toLowerCase().trim() : "";
  const filter = roleFilter ? roleFilter.value : "all";

  const filtered = users.filter(user => {
    const matchesSearch = user.name.toLowerCase().includes(search) || user.email.toLowerCase().includes(search);
    const matchesRole = filter === "all" || user.role === filter;
    return matchesSearch && matchesRole;
  });

  if (filtered.length === 0) {
    table.innerHTML = `
      <tr>
        <td colspan="5" class="p-6 text-center text-gray-500 italic">No users found matching your criteria.</td>
      </tr>
    `;
    return;
  }

  filtered.forEach(user => {
    const statusColor = user.status === "Active"
      ? "bg-green-100 text-green-700"
      : "bg-red-100 text-red-700";

    const row = document.createElement("tr");
    row.className = "hover:bg-gray-50 transition";
    row.innerHTML = `
      <td class="p-4 font-medium text-sm sm:text-base text-gray-900">${user.name}</td>
      <td class="p-4 text-sm sm:text-base text-gray-600">${user.email}</td>
      <td class="p-4 text-sm sm:text-base text-gray-700">${user.role}</td>
      <td class="p-4">
        <span class="px-3 py-1 rounded-full text-xs sm:text-sm font-medium ${statusColor}">
          ${user.status}
        </span>
      </td>
      <td class="p-4">
        <button onclick="viewUser('${user.email}')" class="bg-[#0b2149] text-white px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium hover:bg-white hover:text-[#0b2149] border border-[#0b2149] transition shadow-sm">
          View
        </button>
      </td>
    `;
    table.appendChild(row);
  });
}

function viewUser(email) {
  alert(`Viewing details for user: ${email}`);
}

// EVENTS
if (searchInput) searchInput.addEventListener("input", renderUsers);
if (roleFilter) roleFilter.addEventListener("change", renderUsers);

// INIT - Page load hote hi backend se data fetch hoga
fetchUsers();
</script>

</body>
</html>
