<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | SmartEduX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #0b2149; }
        .input-style {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 2px solid #e5e7eb;
            transition: .3s ease;
        }
        .input-style:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(11, 33, 73, 0.15);
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 sm:p-10 max-w-md w-full text-center">
        
        <!-- Icon -->
        <div class="w-16 h-16 bg-green-50 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-[#0b2149] mb-2">Set New Password</h1>
        <p class="text-gray-500 text-sm mb-8">
            Please enter your new password below.
        </p>

        <!-- Form with ID -->
        <form id="resetForm" class="space-y-5">
            <div>
                <input type="password" id="newPassword" placeholder="New Password" class="input-style" required>
            </div>
            <div>
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" class="input-style" required>
            </div>

            <button type="submit" class="w-full bg-[#0b2149] text-white py-3 rounded-xl font-semibold hover:bg-[#16356d] transition duration-200">
                Update Password
            </button>
        </form>
    </div>

    <script src="connection.js"></script>
<script>
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Page refresh hone se rokay ga

        const newPassField = document.getElementById('newPassword');
        const confirmPassField = document.getElementById('confirmPassword');

        if (!newPassField || !confirmPassField) return;

        const newPass = newPassField.value.trim();
        const confirmPass = confirmPassField.value.trim();

        // 1. Check if passwords match
        if (newPass !== confirmPass) {
            alert('Passwords do not match! Please try again.');
            return;
        }

        // 2. Password length validation
        if (newPass.length < 6) {
            alert('Password must be at least 6 characters long.');
            return;
        }

        // 3. Identify target user via URL parameters or stored reset session
        const urlParams = new URLSearchParams(window.location.search);
        const targetEmail = urlParams.get('email') || localStorage.getItem('reset_email');
        
        let usersList = JSON.parse(localStorage.getItem('usersList')) || [];
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || {};

        let userFound = false;

        // If we have a specific target email (from forgot password flow)
        if (targetEmail) {
            const userIndex = usersList.findIndex(u => u.email.toLowerCase() === targetEmail.toLowerCase());
            if (userIndex !== -1) {
                usersList[userIndex].password = newPass;
                userFound = true;
            }
            
            if (currentUser.email && currentUser.email.toLowerCase() === targetEmail.toLowerCase()) {
                currentUser.password = newPass;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
            }
        } 
        
        // Fallback to current session user if no specific email parameter is found
        if (!userFound && currentUser.email) {
            const userIndex = usersList.findIndex(u => u.email.toLowerCase() === currentUser.email.toLowerCase());
            if (userIndex !== -1) {
                usersList[userIndex].password = newPass;
            }
            currentUser.password = newPass;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            userFound = true;
        }

        // If still not found, fallback to updating or setting default session user safely
        if (!userFound) {
            if (usersList.length > 0) {
                usersList[0].password = newPass;
            } else {
                usersList.push({ email: "user@smartedux.com", password: newPass, role: "Student", status: "Active" });
            }
            currentUser.email = usersList[0].email;
            currentUser.password = newPass;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
        }

        // Save updated users list back to localStorage
        localStorage.setItem('usersList', JSON.stringify(usersList));
        
        // Clean up temporary reset token/email if used
        localStorage.removeItem('reset_email');

        alert('Password updated successfully!');
        
        // 4. Redirect to login page after success
        window.location.href = 'login.html'; 
    });
</script>

</body>
</html>
