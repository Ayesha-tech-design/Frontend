<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | SmartEduX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #0b2149; }
        .input-style {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 2px solid #e5e7eb;
            transition: .3s ease;
        }
        .input-style:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(11, 33, 73, 0.15);
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 sm:p-10 max-w-md w-full text-center">
        
        <!-- Icon -->
        <div class="w-16 h-16 bg-green-50 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-[#0b2149] mb-2">Set New Password</h1>
        <p class="text-gray-500 text-sm mb-8">
            Please enter your new password below.
        </p>

        <!-- Form with ID -->
        <form id="resetForm" class="space-y-5">
            <div>
                <input type="password" id="newPassword" placeholder="New Password" class="input-style" required>
            </div>
            <div>
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" class="input-style" required>
            </div>

            <button type="submit" class="w-full bg-[#0b2149] text-white py-3 rounded-xl font-semibold hover:bg-[#16356d] transition duration-200">
                Update Password
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Page refresh hone se rokay ga

            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            // 1. Check if passwords match
            if (newPass !== confirmPass) {
                alert('Passwords do not match! Please try again.');
                return;
            }

            // 2. Password length validation (optional check)
            if (newPass.length < 6) {
                alert('Password must be at least 6 characters long.');
                return;
            }

            // 3. Update password in localStorage
            // فرض karein user ki email ya session URL parameters ya localStorage se mil rahi hai
            let currentUser = JSON.parse(localStorage.getItem('currentUser')) || {};
            
            if (!currentUser.email) {
                // Agar direct page khula hai aur session nahi hai, toh temporary email set kar lein ya error dein
                currentUser.email = "user@smartedux.com"; 
            }

            currentUser.password = newPass; // Naya password set kiya
            localStorage.setItem('currentUser', JSON.stringify(currentUser));

            // Agar aap saare users ke array ko update karna chahti hain:
            let usersList = JSON.parse(localStorage.getItem('usersList')) || [];
            let userIndex = usersList.findIndex(u => u.email === currentUser.email);
            if (userIndex !== -1) {
                usersList[userIndex].password = newPass;
                localStorage.setItem('usersList', JSON.stringify(usersList));
            }

            alert('Password updated successfully!');
            
            // 4. Redirect to login page after success
            window.location.href = 'login.html'; 
        });
    </script>

</body>
</html>
