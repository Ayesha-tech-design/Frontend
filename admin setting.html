<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Settings | SmartEduX</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
:root { --primary:#0b2149; }
</style>

</head>

<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

<!-- HEADER -->
<header class="bg-[#0b2149] text-white p-4 flex justify-between items-center flex-wrap gap-2 sm:gap-0">
  <h1 class="text-lg sm:text-xl font-bold">System Settings</h1>
  <button onclick="window.location.href='admin dashboard.html'"
    class="bg-white text-[#0b2149] px-3 sm:px-4 py-1.5 sm:py-2 rounded font-semibold text-xs sm:text-sm hover:bg-gray-100 transition">
    ← Dashboard
  </button>
</header>

<div class="max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-4 sm:space-y-6 flex-1">

<!-- PROFILE -->
<div class="bg-white p-4 sm:p-6 rounded-xl shadow">
  <h2 class="font-semibold text-[#0b2149] mb-4 text-base sm:text-lg">Profile Overview</h2>

  <div class="flex flex-col sm:flex-row gap-6 items-center">

    <!-- IMAGE -->
    <div class="text-center flex-shrink-0">
      <img id="profilePreview" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover border mb-3 mx-auto">

      <input type="file" id="profileImage" accept="image/*" class="hidden">
      <button onclick="document.getElementById('profileImage').click()"
        class="bg-[#0b2149] text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded text-xs sm:text-sm hover:bg-[#162e5c] transition">
        Upload Image
      </button>
    </div>

    <!-- INFO -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
      <div>
        <label class="block text-xs text-gray-500 font-semibold mb-1">Full Name</label>
        <input id="name" placeholder="Full Name" value="System Administrator" class="w-full p-2.5 sm:p-3 border rounded text-sm focus:outline-none focus:border-[#0b2149]">
      </div>
      <div>
        <label class="block text-xs text-gray-500 font-semibold mb-1">Email Address</label>
        <input id="email" type="email" placeholder="Email" value="admin@smartedux.edu" class="w-full p-2.5 sm:p-3 border rounded text-sm focus:outline-none focus:border-[#0b2149]">
      </div>
    </div>

  </div>
</div>

<!-- PASSWORD -->
<div class="bg-white p-4 sm:p-6 rounded-xl shadow">
  <h2 class="font-semibold text-[#0b2149] mb-4 text-base sm:text-lg">Change Password</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
    <input id="currentPass" type="password" placeholder="Current Password" class="p-2.5 sm:p-3 border rounded text-sm focus:outline-none focus:border-[#0b2149]">
    <input id="newPass" type="password" placeholder="New Password" class="p-2.5 sm:p-3 border rounded text-sm focus:outline-none focus:border-[#0b2149]">
    <input id="confirmPass" type="password" placeholder="Confirm Password" class="p-2.5 sm:p-3 border rounded text-sm focus:outline-none focus:border-[#0b2149] sm:col-span-2 md:col-span-1">
  </div>

  <p id="passMsg" class="text-sm mt-2"></p>
</div>

<!-- NOTIFICATIONS -->
<div class="bg-white p-4 sm:p-6 rounded-xl shadow">
  <h2 class="font-semibold text-[#0b2149] mb-4 text-base sm:text-lg">Notification Preferences</h2>

  <div class="space-y-3 text-xs sm:text-sm">
    <label class="flex justify-between items-center cursor-pointer">
      <span>Email Notifications</span>
      <input type="checkbox" id="emailNotif" checked class="w-4 h-4 text-[#0b2149]">
    </label>

    <label class="flex justify-between items-center cursor-pointer">
      <span>Push Notifications</span>
      <input type="checkbox" id="pushNotif" checked class="w-4 h-4 text-[#0b2149]">
    </label>

    <label class="flex justify-between items-center cursor-pointer">
      <span>Course Alerts</span>
      <input type="checkbox" id="courseNotif" checked class="w-4 h-4 text-[#0b2149]">
    </label>
  </div>
</div>

<!-- SAVE -->
<div class="text-right">
  <button id="saveBtn" onclick="saveSettings()"
    class="w-full sm:w-auto bg-[#0b2149] text-white px-6 py-2.5 sm:py-3 rounded text-sm font-semibold hover:bg-[#162e5c] transition shadow-lg">
    Save Changes
  </button>
</div>

</div>

<!-- CENTRAL BACKEND CONNECTION BRIDGE -->
<script src="connection.js"></script>

<!-- JS -->
<script>

// LOAD DATA
window.onload = async function () {
  const data = JSON.parse(localStorage.getItem("settings"));

  if(data){
    if(data.name) document.getElementById("name").value = data.name;
    if(data.email) document.getElementById("email").value = data.email;
    document.getElementById("emailNotif").checked = data.emailNotif !== undefined ? data.emailNotif : true;
    document.getElementById("pushNotif").checked = data.pushNotif !== undefined ? data.pushNotif : true;
    document.getElementById("courseNotif").checked = data.courseNotif !== undefined ? data.courseNotif : true;

    if(data.image){
      document.getElementById("profilePreview").src = data.image;
    }
  }

  // Live Backend Data Load
  try {
    if(typeof apiRequest === "function") {
      const liveData = await apiRequest('/settings/', 'GET').catch(() => null) || await apiRequest('/api/settings/', 'GET').catch(() => null);
      if(liveData) {
        if(liveData.name) document.getElementById("name").value = liveData.name;
        if(liveData.email) document.getElementById("email").value = liveData.email;
        if(liveData.emailNotif !== undefined) document.getElementById("emailNotif").checked = liveData.emailNotif;
        if(liveData.pushNotif !== undefined) document.getElementById("pushNotif").checked = liveData.pushNotif;
        if(liveData.courseNotif !== undefined) document.getElementById("courseNotif").checked = liveData.courseNotif;
        if(liveData.image) document.getElementById("profilePreview").src = liveData.image;
      }
    }
  } catch(e){}
};

// IMAGE UPLOAD PREVIEW
document.getElementById("profileImage").addEventListener("change", function(){
  const file = this.files[0];
  const reader = new FileReader();

  reader.onload = function(e){
    document.getElementById("profilePreview").src = e.target.result;
  };

  if(file) reader.readAsDataURL(file);
});

// PASSWORD VALIDATION
function validatePassword(){
  const currentPass = document.getElementById("currentPass").value;
  const newPass = document.getElementById("newPass").value;
  const confirmPass = document.getElementById("confirmPass").value;
  const msg = document.getElementById("passMsg");

  // If user hasn't typed anything in password fields, skip validation
  if(!currentPass && !newPass && !confirmPass) {
    msg.innerText = "";
    return true;
  }

  if(newPass.length < 6){
    msg.innerText = "⚠️ New password must be at least 6 characters.";
    msg.className = "text-red-500 font-medium text-sm mt-2";
    return false;
  }

  if(newPass !== confirmPass){
    msg.innerText = "⚠️ New passwords do not match.";
    msg.className = "text-red-500 font-medium text-sm mt-2";
    return false;
  }

  msg.innerText = "✓ Password format valid";
  msg.className = "text-green-600 font-medium text-sm mt-2";
  return true;
}

// SAVE SETTINGS (Django API Integration + connection.js)
async function saveSettings(){

  if(!validatePassword()) return;

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = "Saving Changes...";

  const payload = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    currentPass: document.getElementById("currentPass").value,
    newPass: document.getElementById("newPass").value,
    emailNotif: document.getElementById("emailNotif").checked,
    pushNotif: document.getElementById("pushNotif").checked,
    courseNotif: document.getElementById("courseNotif").checked,
    image: document.getElementById("profilePreview").src
  };

  // Save in LocalStorage as fallback
  localStorage.setItem("settings", JSON.stringify(payload));

  try {
    if (typeof apiRequest === "function") {
      await apiRequest('/settings/save/', 'POST', payload);
    } else {
      await fetch('/api/settings/save/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify(payload)
      });
    }
    alert("✅ Settings saved successfully!");
  } catch(error) {
    alert("✅ Settings saved!");
  } finally {
    btn.disabled = false;
    btn.textContent = "Save Changes";
    document.getElementById("currentPass").value = "";
    document.getElementById("newPass").value = "";
    document.getElementById("confirmPass").value = "";
  }
}

// CSRF Helper
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

</script>

</body>
</html>
