<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Playlist | SmartEduX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .player-tab.active {
            border-bottom-color: #0b2149;
            color: #0b2149;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

<header class="shadow sticky top-0 z-50" style="background-color:#0b2149;">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <a href="SmartEduX.html" class="text-xl font-bold text-white">SmartEduX</a>

        <a href="signup.html"
           id="signupBtn"
           class="px-4 py-2 bg-white text-[#0b2149] rounded font-medium hover:bg-gray-200 transition text-sm">
           Signup
        </a>
    </div>
</header>

<main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow w-full">

  <section class="lg:col-span-2 flex flex-col space-y-4">
    
    <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-lg flex items-center justify-center">
      <iframe 
        id="youtube-player" 
        class="w-full h-full border-0 hidden" 
        src="" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>

      <video id="local-video-player" class="w-full h-full hidden" controls>
        <source id="video-source" src="" type="video/mp4">
      </video>
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
      <div>
        <h2 id="lecture-title" class="text-lg md:text-xl font-bold text-[#0b2149]">Loading...</h2>
        <p id="lecture-progress-text" class="text-xs text-gray-500">Lec 1 of 15</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="prevLecture()" class="flex-1 sm:flex-none px-4 py-2 bg-gray-100 text-[#0b2149] rounded-lg text-xs font-bold hover:bg-gray-200 transition">
          ◀ Previous
        </button>
        <button onclick="nextLecture()" class="flex-1 sm:flex-none px-4 py-2 bg-[#0b2149] text-white rounded-lg text-xs font-bold hover:bg-[#16356d] transition">
          Next ▶
        </button>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
      <div class="flex border-b border-gray-200 text-xs md:text-sm font-semibold mb-4 overflow-x-auto">
        <button id="tab-overview" onclick="switchPlayerTab('overview')" class="player-tab active px-4 py-2 border-b
          Overview & Details
        </button>
        <button id="tab-notes" onclick="switchPlayerTab('notes')" class="player-tab px-4 py-2 border-b-2 whitespace-nowrap text-gray-600">
          AI Smart Notes ⚡
        </button>
        <button id="tab-mcqs" onclick="switchPlayerTab('mcqs')" class="player-tab px-4 py-2 border-b-2 whitespace-nowrap text-gray-600">
          Instant MCQs
        </button>
      </div>

      <div id="player-content-overview" class="space-y-2">
        <p id="lecture-desc" class="text-xs md:text-sm text-gray-600 leading-relaxed"></p>
      </div>

      <div id="player-content-notes" class="hidden space-y-3">
        <div id="lecture-bullet-points" class="space-y-2"></div>
      </div>

      <div id="player-content-mcqs" class="hidden space-y-3">
        <div id="lecture-mcq-container" class="space-y-3"></div>
      </div>
    </div>

  </section>

  <aside class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col h-[500px] lg:h-[calc(100vh-120px)] sticky top-20">
    
    <div class="space-y-3 mb-4">
      <div class="flex items-center justify-between">
        <div>
            <span id="course-category" class="text-[10px] font-bold text-blue-600 uppercase tracking-wide">Category</span>
            <h3 id="course-title" class="font-bold text-[#0b2149] text-sm md:text-base">Playlist Lectures</h3>
        </div>
        <span id="playlist-count" class="text-xs bg-blue-100 text-blue-900 font-bold px-2.5 py-1 rounded-full">0 Lectures</span>
      </div>

      <select id="course-selector" onchange="changeCourse(this.value)" class="w-full text-xs p-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#0b2149]">
  <option value="graphics">Graphic Design</option>
  <option value="fiverr">Fiverr Freelancing</option>
  <option value="wordpress">WordPress Development</option>
  <option value="infosec">Information Security</option>
</select>

      <input 
        type="text" 
        id="lecture-search" 
        oninput="filterPlaylist(this.value)" 
        placeholder="Search lectures..." 
        class="w-full text-xs p-2.5 rounded-lg border border-gray-200 focus:ring-1 focus:ring-[#0b2149] outline-none"
      />
    </div>

    <div id="playlist-container" class="flex-grow overflow-y-auto space-y-2 pr-1">
        </div>

  </aside>

</main>

let currentCourseKey = "graphics";
let currentLectureIndex = 0;

function initCourse(courseKey) {
    if (!playlistsData[courseKey]) courseKey = "graphics";
    currentCourseKey = courseKey;
    
    document.getElementById("course-selector").value = courseKey;
    document.getElementById("course-category").textContent = playlistsData[courseKey].category;
    document.getElementById("course-title").textContent = playlistsData[courseKey].title;
    
    renderPlaylist();
    loadLecture(0);
}

function changeCourse(courseKey) {
    initCourse(courseKey);
}

function renderPlaylist(searchQuery = "") {
    const container = document.getElementById("playlist-container");
    container.innerHTML = "";
    const lectures = playlistsData[currentCourseKey].lectures;
    let count = 0;

    lectures.forEach((lec, idx) => {
        if (searchQuery && !lec.title.toLowerCase().includes(searchQuery.toLowerCase())) {
            return;
        }
        count++;
        const isSelected = idx === currentLectureIndex;

        const item = document.createElement("div");
        item.className = `p-3 rounded-xl border transition cursor-pointer flex items-center justify-between ${isSelected ? 'bg-blue-50 border-blue-300 shadow-sm' : 'bg-white border-gray-100 hover:border-gray-300'}`;
        
        item.onclick = () => loadLecture(idx);

        item.innerHTML = `
            <div class="space-y-1 pr-2">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold ${isSelected ? 'text-blue-900' : 'text-gray-800'}">${lec.title}</span>
                </div>
                <div class="flex items-center gap-2 text-[10px] text-gray-400">
                    <span>⏱ ${lec.duration}</span>
                </div>
            </div>
            <button class="px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-100 text-[#0b2149] hover:bg-slate-200">
                View
            </button>
        `;
        container.appendChild(item);
    });

    document.getElementById("playlist-count").textContent = count + " Lectures";
}

function filterPlaylist(query) {
    renderPlaylist(query);
}

function loadLecture(index) {
    currentLectureIndex = index;
    const lec = playlistsData[currentCourseKey].lectures[index];

    const localPlayer = document.getElementById("local-video-player");
    const ytPlayer = document.getElementById("youtube-player");

    if (localPlayer) localPlayer.classList.add("hidden");
    if (ytPlayer) {
        ytPlayer.classList.remove("hidden");
        ytPlayer.src = `https://www.youtube.com/embed/${lec.videoId}?autoplay=1`;
    }

    document.getElementById("lecture-title").textContent = lec.title;
    document.getElementById("lecture-desc").textContent = lec.desc;
    document.getElementById("lecture-progress-text").textContent = `Lec ${index + 1} of ${playlistsData[currentCourseKey].lectures.length}`;

    // Render Bullet Points
    const notesContainer = document.getElementById("lecture-bullet-points");
    notesContainer.innerHTML = "";
    lec.points.forEach(point => {
        const pDiv = document.createElement("div");
        pDiv.className = "flex items-start gap-2.5 text-xs text-gray-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100";
        pDiv.innerHTML = `<span class="text-blue-600 font-bold mt-0.5">•</span><span>${point}</span>`;
        notesContainer.appendChild(pDiv);
    });

    // Render MCQs
    const mcqContainer = document.getElementById("lecture-mcq-container");
    mcqContainer.innerHTML = "";
    lec.mcqs.forEach((mcq, mIdx) => {
        const mDiv = document.createElement("div");
        mDiv.className = "bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3";
        let optionsHtml = "";
        mcq.options.forEach((opt, oIdx) => {
            optionsHtml += `
                <label class="flex items-center gap-2 text-xs text-gray-700 cursor-pointer bg-white p-2.5 rounded-lg border border-gray-200 hover:border-blue-400 transition">
                    <input type="radio" name="mcq-${index}-${mIdx}" value="${oIdx}">
                    <span>${opt}</span>
                </label>
            `;
        });
        mDiv.innerHTML = `<p class="text-xs font-bold text-[#0b2149]">Q${mIdx + 1}: ${mcq.q}</p><div class="space-y-2">${optionsHtml}</div>`;
        mcqContainer.appendChild(mDiv);
    });

    renderPlaylist(document.getElementById("lecture-search").value);
}

function prevLecture() {
    if (currentLectureIndex > 0) loadLecture(currentLectureIndex - 1);
}

function nextLecture() {
    const total = playlistsData[currentCourseKey].lectures.length;
    if (currentLectureIndex < total - 1) loadLecture(currentLectureIndex + 1);
}

function switchPlayerTab(tabName) {
    document.querySelectorAll(".player-tab").forEach(tab => tab.classList.remove("active"));
    document.getElementById("player-content-overview").classList.add("hidden");
    document.getElementById("player-content-notes").classList.add("hidden");
    document.getElementById("player-content-mcqs").classList.add("hidden");

    if (tabName === 'overview') {
        document.getElementById("tab-overview").classList.add("active");
        document.getElementById("player-content-overview").classList.remove("hidden");
    } else if (tabName === 'notes') {
        document.getElementById("tab-notes").classList.add("active");
        document.getElementById("player-content-notes").classList.remove("hidden");
    } else if (tabName === 'mcqs') {
        document.getElementById("tab-mcqs").classList.add("active");
        document.getElementById("player-content-mcqs").classList.remove("hidden");
    }
}

// Window Load Event (Reads URL Parameters)
window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const courseParam = urlParams.get('course');
    const lecParam = parseInt(urlParams.get('lec')) || 0;

    if (courseParam && playlistsData[courseParam]) {
        initCourse(courseParam);
        loadLecture(lecParam);
    } else {
        initCourse("graphics");
    }
};
</script>
