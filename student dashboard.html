<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | SmartEduX</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root { --primary:#0b2149; }
</style>
</head>

<body class="bg-gray-100 font-sans flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-[#0b2149] text-white min-h-screen p-5 hidden md:block">

  <h2 class="text-2xl font-bold mb-8">Student</h2>

  <nav class="space-y-4">
    <a href="SmartEduX.html" class="block hover:text-gray-300">Home</a>
    <a href="courses.html" class="block hover:text-gray-300">Courses</a>
    <a href="autonotes.html" class="block hover:text-gray-300">AI Auto Notes</a>
    <a href="assignments.html" class="block hover:text-gray-300">Assignments</a>
    <a href="#" class="block hover:text-gray-300">Saved Notes</a>
    <a href="#" onclick="toggleNotifications()" class="block hover:text-gray-300">🔔 Notifications <span id="notifCountSidebar" class="ml-1 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span></a>
    <a href="student profile.html" class="block hover:text-gray-300">Profile</a>
    <button onclick="logout()" class="w-full text-left hover:text-gray-300">Logout</button>
  </nav>

</aside>

<!-- MAIN -->
<div class="flex-1">

<!-- NAVBAR -->
<header class="bg-white shadow px-6 py-4 flex justify-between items-center">

  <h1 class="text-xl font-bold text-[#0b2149]">Student Dashboard</h1>

  <!-- PROFILE DROPDOWN + Notifications -->
  <div class="flex items-center gap-4">

    <div class="relative">
      <button onclick="toggleNotifications()" class="text-[#0b2149] text-xl">
        🔔
      </button>
      <span id="notifCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
    </div>

    <div class="relative">
      <button onclick="toggleProfile()" class="bg-[#0b2149] text-white px-4 py-2 rounded">Profile</button>

      <div id="profileMenu" class="hidden absolute right-0 mt-2 bg-white shadow rounded w-40">
        <a href="student profile.html" class="block px-4 py-2 hover:bg-gray-100">Profile</a>
        <button onclick="logout()" class="w-full text-left px-4 py-2 hover:bg-gray-100">Logout</button>
      </div>
    </div>

  </div>

</header>

<!-- CONTENT -->
<div class="p-6 space-y-6">

  <!-- WELCOME -->
  <div class="bg-white p-6 rounded-xl shadow">
    <h2 class="text-lg font-semibold text-[#0b2149]">Welcome Back !</h2>
    <p class="text-gray-600">Continue your learning journey</p>
  </div>

  <!-- PROGRESS SECTION -->
  <div class="bg-white p-6 rounded-xl shadow mt-6">
    <h3 class="text-xl font-bold text-[#0b2149] mb-4">Your Progress</h3>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-center">
      <div class="bg-gray-100 p-4 rounded-lg">
        <p class="text-sm text-gray-500">Courses</p>
        <h4 class="text-lg font-bold text-[#0b2149]" id="courseCount">3</h4>
      </div>
      <div class="bg-gray-100 p-4 rounded-lg">
        <p class="text-sm text-gray-500">Assignments</p>
        <h4 class="text-lg font-bold text-[#0b2149]" id="assignmentCount">5</h4>
      </div>
      <!-- GPA, Progress, Certification ke HTML tags -->
<div class="bg-gray-100 p-4 rounded-lg">
  <p class="text-sm text-gray-500">GPA</p>
  <h4 class="text-lg font-bold text-[#0b2149]" id="studentGPA">0.0</h4>
</div>
<div class="bg-gray-100 p-4 rounded-lg">
  <p class="text-sm text-gray-500">Progress</p>
  <h4 class="text-lg font-bold text-green-600" id="studentProgress">0%</h4>
</div>
<div class="bg-gray-100 p-4 rounded-lg">
  <p class="text-sm text-gray-500">Certification</p>
  <h4 class="text-lg font-bold text-yellow-600" id="studentCert">0 Earned</h4>
</div>
    </div>
  </div>

 <!-- COURSES -->
<div class="bg-white p-6 rounded shadow">
  <h3 class="text-lg font-semibold mb-4">My Courses</h3>
  <div class="space-y-3" id="coursesList">
    <!-- Backend se yahan dynamic courses aayenge -->
  </div>
</div>

<!-- NOTIFICATIONS PANEL -->
<div id="notificationPanel"
  class="fixed right-4 top-20 bg-white shadow-xl rounded-lg w-80 p-4 hidden">

  <h3 class="font-semibold mb-3">Notifications</h3>
  <ul id="notifList" class="space-y-2 text-sm"></ul>

</div>

<script src="connection.js"></script>
<script>
// PROFILE DROPDOWN
function toggleProfile(){
  document.getElementById("profileMenu").classList.toggle("hidden");
}

// LOGOUT
function logout(){
  localStorage.removeItem("access_token");
  localStorage.removeItem("refresh_token");
  window.location.href = "login.html";
}

// NOTIFICATIONS PANEL
function toggleNotifications(){
  const panel = document.getElementById("notificationPanel");
  panel.classList.toggle("hidden");
}

async function loadStudentDashboard() {
  const profileData = await apiRequest("/student/dashboard/", "GET");
  if (profileData) {
    if (profileData.welcome_name) {
      document.querySelector(".bg-white.p-6.rounded-xl.shadow p.text-gray-600")
        .textContent = `Welcome back, ${profileData.welcome_name}! Continue your learning journey`;
    }
    if (profileData.course_count !== undefined) {
      document.getElementById("courseCount").innerText = profileData.course_count;
    }
    if (profileData.assignment_count !== undefined) {
      document.getElementById("assignmentCount").innerText = profileData.assignment_count;
    }

    // Courses ko dynamic show karne ke liye
    const coursesContainer = document.getElementById("coursesList");
    if (coursesContainer) {
      coursesContainer.innerHTML = "";
      
      console.log("Profile Data Courses:", profileData.courses);

      if (profileData.courses && profileData.courses.length > 0) {
        profileData.courses.forEach(course => {
          coursesContainer.innerHTML += `
            <div class="flex justify-between">
              <span>${course.title}</span>
              <span class="text-blue-600">${course.progress}%</span>
            </div>
          `;
        });
      } else {
        coursesContainer.innerHTML = `<p class="text-gray-500 text-sm">No courses enrolled yet.</p>`;
      }
    }
  } // <-- Yahan coursesContainer wala block mukammal band ho gaya hai!

  if (profileData && profileData.gpa !== undefined) {
    document.getElementById("studentGPA").innerText = profileData.gpa;
  }
  if (profileData && profileData.progress !== undefined) {
    document.getElementById("studentProgress").innerText = profileData.progress;
  }
  if (profileData && profileData.certifications !== undefined) {
    document.getElementById("studentCert").innerText = profileData.certifications + " Earned";
  }

  // 2. Load Notifications
  let notifications = [
    "New assignment uploaded",
    "New course available",
    "Website updated successfully"
  ];
  
  const notifData = await apiRequest("/notifications/", "GET");
  if (notifData && Array.isArray(notifData) && notifData.length > 0) {
    notifications = notifData.map(n => n.message);
  }

  const list = document.getElementById("notifList");
  if (list) {
    list.innerHTML = "";
    notifications.forEach(n => {
      list.innerHTML += `<li class="p-2 bg-gray-100 rounded">${n}</li>`;
    });
  }

  const notifCount = document.getElementById("notifCount");
  if (notifCount) notifCount.innerText = notifications.length;

  const notifCountSidebar = document.getElementById("notifCountSidebar");
  if (notifCountSidebar) notifCountSidebar.innerText = notifications.length;
}

// Initialize on page load
loadStudentDashboard();
</script>
</body>
</html>
