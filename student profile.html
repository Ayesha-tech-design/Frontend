<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartEduX | Student Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- NAVBAR -->
<nav class="bg-[#0b2149] px-6 py-3 flex justify-between items-center text-white">
  <h1 class="text-xl font-bold">SmartEduX</h1>

  <div class="flex items-center gap-4">
    <!-- Dashboard Link -->
    <a href="student dashboard.html"
       class="text-sm bg-white text-[#0b2149] px-4 py-1 rounded hover:bg-gray-200">
      Dashboard
    </a>

    <!-- Avatar -->
    <img id="navProfileImg"
         src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
         class="w-9 h-9 rounded-full border-2 border-white object-cover">
  </div>
</nav>

<!-- MAIN -->
<main class="max-w-5xl mx-auto px-6 py-10">

  <!-- PROFILE CARD -->
  <div class="bg-white rounded-2xl p-8 shadow mb-10 flex flex-col md:flex-row gap-8 items-center">

    <!-- Image -->
    <div class="text-center">
      <img id="profileImg"
           src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
           class="w-32 h-32 rounded-full border-4 border-[#0b2149] object-cover mx-auto">

      <label class="block mt-4 text-sm text-[#0b2149] cursor-pointer font-semibold">
        Change Photo
        <input type="file" accept="image/*" hidden onchange="changeImage(event)">
      </label>
    </div>

    <!-- Info -->
    <div>
      <!-- Backend se aayega -->
      <h2 class="text-2xl font-bold text-[#0b2149]" id="studentName">
        <!-- Dynamic Name -->
        Student Name
      </h2>
      <p class="text-gray-500" id="studentEmail">
        student@email.com
      </p>
    </div>

  </div>

  <!-- PROFILE FORM -->
  <div class="bg-white rounded-2xl p-8 shadow mb-10">
    <h3 class="text-lg font-semibold text-[#0b2149] mb-6">Profile Information</h3>

    <form class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <input type="text" id="fullNameInput" class="border p-3 rounded" placeholder="Full Name">
  <input type="email" id="emailInput" class="border p-3 rounded" placeholder="Email Address">
  <input type="text" id="regNoInput" class="border p-3 rounded" placeholder="Registration Number">
  <input type="text" id="deptInput" class="border p-3 rounded" placeholder="Department">

  <button type="submit" class="md:col-span-2 bg-[#0b2149] text-white py-3 rounded hover:bg-[#163a78] transition">
    Update Profile
  </button>
</form>
  </div>

  <!-- SECURITY SECTION -->
  <div class="bg-white rounded-2xl p-8 shadow">
    <h3 class="text-lg font-semibold text-[#0b2149] mb-6">Security Settings</h3>

    <form class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input type="password" class="border p-3 rounded" placeholder="Current Password">
      <input type="password" class="border p-3 rounded" placeholder="New Password">
      <input type="password"
             class="border p-3 rounded md:col-span-2"
             placeholder="Confirm New Password">

      <button
        class="md:col-span-2 bg-red-600 text-white py-3 rounded hover:bg-red-700 transition">
        Change Password
      </button>
    </form>

    <!-- LOGIN INFO -->
    <div class="mt-6 bg-gray-50 p-4 rounded">
      <p class="text-sm text-gray-600">
        Last Login: 10 Jan 2026 • Chrome • Pakistan
      </p>
      <button class="mt-2 text-sm text-[#0b2149] font-semibold hover:underline">
        Logout from all devices
      </button>
    </div>
  </div>

</main>

<script src="connection.js"></script>
<script>
// 1. Image Preview & Upload Handler
function changeImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function () {
    const result = reader.result;
    document.getElementById('profileImg').src = result;
    document.getElementById('navProfileImg').src = result;
  };
  reader.readAsDataURL(file);
}

async function loadStudentProfile() {
  try {
    const data = await apiRequest("/student/profile/", "GET");
    
    // Fallback values agar backend se data na mile
    const profileData = data || {
      full_name: "Ayesha Waris",
      email: "ayeshawaris44@gmail.com",
      registration_number: "",
      department: ""
    };

    // UI elements update karna
    document.getElementById("studentName").innerText = profileData.full_name || "Ayesha Waris";
    document.getElementById("studentEmail").innerText = profileData.email || "ayeshawaris44@gmail.com";

    if (profileData.profile_image) {
      document.getElementById("profileImg").src = profileData.profile_image;
      document.getElementById("navProfileImg").src = profileData.profile_image;
    }

    // Input fields mein values set karna
    document.getElementById("fullNameInput").value = profileData.full_name || "Ayesha Waris";
    document.getElementById("emailInput").value = profileData.email || "ayeshawaris44@gmail.com";
    document.getElementById("regNoInput").value = profileData.registration_number || "";
    document.getElementById("deptInput").value = profileData.department || "";

  } catch (error) {
    console.error("Profile load error:", error);
    // Error ki surat mein default values fill kar dein taake fields khali na rahein
    document.getElementById("fullNameInput").value = "Ayesha Waris";
    document.getElementById("emailInput").value = "ayeshawaris44@gmail.com";
  }
}
// 3. Update Profile Form Submission
document.querySelector(".bg-white.rounded-2xl.p-8.shadow.mb-10 form").addEventListener("submit", async function(e) {
  e.preventDefault();
  
  const payload = {
    full_name: document.getElementById("fullNameInput").value.trim(),
    email: document.getElementById("emailInput").value.trim(),
    registration_number: document.getElementById("regNoInput").value.trim(),
    department: document.getElementById("deptInput").value.trim()
  };

  const response = await apiRequest("/student/profile/", "PUT", payload);
  if (response) {
    alert("Profile updated successfully!");
    loadStudentProfile();
  } else {
    alert("Failed to update profile. Please check your inputs.");
  }
});

// 4. Change Password Form Submission
document.querySelectorAll(".bg-white.rounded-2xl.p-8.shadow")[1].querySelector("form").addEventListener("submit", async function(e) {
  e.preventDefault();
  const passInputs = this.querySelectorAll("input[type='password']");
  
  const currentPassword = passInputs[0].value;
  const newPassword = passInputs[1].value;
  const confirmPassword = passInputs[2].value;

  if (newPassword !== confirmPassword) {
    alert("⚠️ New Password and Confirm Password do not match!");
    return;
  }

  const response = await apiRequest("/auth/change-password/", "POST", {
    current_password: currentPassword,
    new_password: newPassword
  });

  if (response && (response.success || response.message)) {
    alert("Password changed successfully!");
    this.reset();
  } else {
    alert("Password change failed: " + (response?.detail || response?.message || "Check your current password."));
  }
});

// 5. Logout from all devices handler
document.querySelector(".mt-2.text-sm.text-\\[\\#0b2149\\]")?.addEventListener("click", async function() {
  if (confirm("Are you sure you want to logout from all devices?")) {
    const res = await apiRequest("/auth/logout-all/", "POST");
    localStorage.removeItem("access_token");
    localStorage.removeItem("refresh_token");
    window.location.href = "login.html";
  }
});

// Run on page load
loadStudentProfile();
</script>

</body>
</html>
