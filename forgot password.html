<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SmartEduX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #0b2149; }
        .input-style {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 2px solid #e5e7eb;
            transition: .3s ease;
        }
        .input-style:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(11, 33, 73, 0.15);
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <!-- Card Container -->
    <div class="bg-white rounded-2xl shadow-xl p-8 sm:p-10 max-w-md w-full text-center">
        
        <!-- Icon -->
        <div class="w-16 h-16 bg-blue-50 text-[#0b2149] rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-[#0b2149] mb-2">Forgot Password?</h1>
        <p class="text-gray-500 text-sm mb-8">
            No worries! Enter your registered email address below, and we'll send you instructions to reset your password.
        </p>

        <!-- Form -->
        <form class="space-y-5">
            <input type="email" placeholder="Enter your email" class="input-style" required>

            <!-- Replace the old button with this one -->
<button type="submit" class="w-full bg-[#0b2149] text-white py-3 rounded-xl font-semibold hover:bg-[#16356d] transition duration-200">
    Send Code
</button>
        </form>

        <!-- Back to Login -->
        <div class="mt-6">
            <a href="login.html" class="text-sm text-gray-600 hover:text-[#0b2149] font-medium flex items-center justify-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Back to Login
            </a>
        </div>
    </div>
<script src="connection.js"></script>
<script>
    const form = document.querySelector('form');
    if (form) {
        // Add an ID to the email input dynamically for easy selection if not already present
        const emailInput = form.querySelector('input[type="email"]');
        if (emailInput && !emailInput.id) {
            emailInput.id = 'resetEmail';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page refresh

            const emailField = document.getElementById('resetEmail') || form.querySelector('input[type="email"]');
            if (!emailField) return;

            const email = emailField.value.trim().toLowerCase();

            if (!email) {
                alert('Please enter your registered email address.');
                return;
            }

            // Check if the user exists in localStorage usersList
            let usersList = JSON.parse(localStorage.getItem('usersList')) || [];
            
            // If usersList is empty or user not found, we can check currentUser as fallback
            let currentUser = JSON.parse(localStorage.getItem('currentUser')) || {};
            
            const userExists = usersList.some(u => u.email && u.email.toLowerCase() === email) || 
                               (currentUser.email && currentUser.email.toLowerCase() === email);

            if (!userExists && usersList.length > 0) {
                alert('This email is not registered with SmartEduX!');
                return;
            }

            // Store the reset email temporarily so set-new-password.html knows which user to update
            localStorage.setItem('reset_email', email);

            alert('Reset instructions sent successfully! Redirecting to set new password...');

            // Redirect to set-new-password.html page with email parameter
            window.location.href = `set new passward.html?email=${encodeURIComponent(email)}`;
        });
    }
</script>
</body>
</html>
