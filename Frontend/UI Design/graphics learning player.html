<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartEduX Learning Player</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<nav class="bg-[#0b2149] text-white px-6 py-4 flex justify-between">
    <h1 class="text-2xl font-bold">SmartEduX</h1>
    <span>Graphics Designing Course</span>
</nav>

<div class="flex flex-col lg:flex-row h-[calc(100vh-72px)]">

    <!-- Playlist -->
    <aside class="w-full lg:w-80 bg-white shadow-lg overflow-y-auto">

        <div class="p-5 border-b">
            <h2 class="font-bold text-lg">Course Content</h2>
            <p class="text-sm text-gray-500">3 Lectures</p>
        </div>

        <div id="playlist">

            <button onclick="loadLecture(0)"
                class="lecture-btn w-full text-left p-4 border-b hover:bg-blue-50">
                 Lecture 1: Introduction
            </button>

            <button onclick="loadLecture(1)"
                class="lecture-btn w-full text-left p-4 border-b hover:bg-blue-50">
                 Lecture 2: Tools Overview
            </button>

            <button onclick="loadLecture(2)"
                class="lecture-btn w-full text-left p-4 border-b hover:bg-blue-50">
                 Lecture 3: Design Principles
            </button>

        </div>

    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-y-auto">

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">

            <video id="videoPlayer"
                controls
                class="w-full h-[500px] bg-black">
            </video>

            <div class="p-6">

                <h2 id="lectureTitle"
                    class="text-2xl font-bold text-[#0b2149]">
                </h2>

                <p class="text-gray-600 mt-2">
                    Watch the lecture and generate AI Notes or MCQs instantly.
                </p>

                <div class="flex flex-wrap gap-4 mt-6">

                    <button onclick="generateNotes()"
                        class="bg-[#0b2149] text-white px-5 py-3 rounded-lg transition-none">
                         Generate Notes
                    </button>
                        <div id="savedNotesContainer" class="mt-4 hidden">

    <button onclick="openSavedNotes()"
        class="bg-[#0b2149] text-white px-5 py-3 rounded-lg">
        📄 Saved Notes
    </button>

</div>
                    <button onclick="generateMCQs()"
                        class="bg-[#0b2149] text-white px-5 py-3 rounded-lg transition-none">
                         Generate MCQs
                    </button>

                    <button onclick="nextLecture()"
                        class="bg-[#0b2149] text-white px-5 py-3 rounded-lg transition-none">
                        Next Lecture →
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>

<script>
// Authentication check on page load
function checkAuth() {
    const token = localStorage.getItem("access_token");
    if (!token) {
        alert("Please login first to access the learning player!");
        window.location.href = "login.html";
    }
}
window.onload = function() {
    checkAuth();
    loadLecture(0);
};

const lectures = [
    {
        title: "Introduction to Graphic Designing",
        video: "lecture1.mp4",
        id: 1
    },
    {
        title: "Tools Overview",
        video: "lecture2.mp4",
        id: 2
    },
    {
        title: "Basic Design Principles",
        video: "lecture3.mp4",
        id: 3
    }
];

let currentLecture = 0;

function loadLecture(index){
    currentLecture = index;
    document.getElementById("lectureTitle").innerText = lectures[index].title;
    document.getElementById("videoPlayer").src = lectures[index].video;
}

function nextLecture(){
    if(currentLecture < lectures.length - 1){
        loadLecture(currentLecture + 1);
    } else {
        alert("You have reached the end of the course playlist!");
    }
}

function generateNotes(){
    const lectureId = lectures[currentLecture].id;
    const token = localStorage.getItem("access_token");

    // Backend API integration ready
    fetch(`/api/generate-notes/${lectureId}/`, {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        }
    })
    .then(response => {
        if(response.ok) {
            alert("Notes Generated Successfully For Lecture ID: " + lectureId);
            document.getElementById("savedNotesContainer").classList.remove("hidden");
            localStorage.setItem("savedNotesLecture", lectureId);
        } else {
            alert("Failed to generate notes. Please try again.");
        }
    })
    .catch(error => {
        // Fallback alert for local static simulation if backend is offline
        alert("Notes Generated Successfully For Lecture ID: " + lectureId);
        document.getElementById("savedNotesContainer").classList.remove("hidden");
        localStorage.setItem("savedNotesLecture", lectureId);
    });
}
  
function openSavedNotes(){
    const lectureId = localStorage.getItem("savedNotesLecture");
    if(lectureId) {
        window.location.href = `saved notes.html?lecture=${lectureId}`;
    } else {
        alert("No saved notes found!");
    }
}

function generateMCQs(){
    const lectureId = lectures[currentLecture].id;
    const token = localStorage.getItem("access_token");

    fetch(`/api/generate-mcqs/${lectureId}/`, {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        }
    })
    .then(response => {
        if(response.ok) {
            alert("Generate MCQs API Called For Lecture ID: " + lectureId);
        } else {
            alert("Could not process MCQ generation.");
        }
    })
    .catch(error => {
        alert("Generate MCQs API Called For Lecture ID: " + lectureId);
    });
}
</script>

</body>
</html>
