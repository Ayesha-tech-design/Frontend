<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Assignments | SmartEduX</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root { --primary:#0b2149; }
</style>
</head>
<body class="bg-gray-100 font-sans flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-[#0b2149] text-white min-h-screen p-5 hidden md:block">
  <h2 class="text-2xl font-bold mb-8">Teacher</h2>
  <nav class="space-y-4">
    <a href="teacher dashboard.html" class="block hover:text-gray-300">Home</a>
    <a href="teacher courses.html" class="block hover:text-gray-300">My Courses</a>
    <a href="teacher assignments.html" class="block hover:text-gray-300 font-bold">Assignments</a>
    <a href="student dashboard.html" class="block hover:text-gray-300">Students</a>
    <a href="#" onclick="toggleNotifications()" class="block hover:text-gray-300 flex justify-between items-center">
      🔔 Notifications
      <span id="notifCount" class="bg-red-600 rounded-full text-xs w-5 h-5 flex items-center justify-center">0</span>
    </a>
    <a href="teacher profile.html" class="block hover:text-gray-300">Profile</a>
    <button onclick="logout()" class="w-full text-left hover:text-gray-300">Logout</button>
  </nav>
</aside>

<!-- MAIN -->
<div class="flex-1">

  <!-- NAVBAR -->
  <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-[#0b2149]">Assignments</h1>
    <div class="relative flex items-center gap-4">
      <button onclick="toggleNotifications()" class="relative bg-[#0b2149] text-white px-4 py-2 rounded">
        🔔
        <span id="notifCountNav" class="absolute top-0 right-0 -mt-1 -mr-1 bg-red-600 text-xs w-5 h-5 flex items-center justify-center rounded-full">0</span>
      </button>

      <div class="relative">
        <button onclick="toggleProfile()" class="bg-[#0b2149] text-white px-4 py-2 rounded">Profile</button>
        <div id="profileMenu" class="hidden absolute right-0 mt-2 bg-white shadow rounded w-40">
          <a href="teacher profile.html" class="block px-4 py-2 hover:bg-gray-100">Profile</a>
          <button onclick="logout()" class="w-full text-left px-4 py-2 hover:bg-gray-100">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="p-6 space-y-6">

    <!-- Quick Add Assignment -->
    <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow">
      <h2 class="text-lg font-bold text-[#0b2149]">Assignments Overview</h2>
      <button onclick="addAssignment()" class="bg-[#0b2149] text-white px-4 py-2 rounded hover:bg-gray-800 transition">Add New Assignment</button>
    </div>

    <!-- Assignments Table -->
    <div class="bg-white p-6 rounded-xl shadow overflow-x-auto">
      <table class="w-full text-left table-auto">
        <thead>
          <tr class="bg-gray-100">
            <th class="p-3 font-semibold text-[#0b2149]">Title</th>
            <th class="p-3 font-semibold text-[#0b2149]">Course</th>
            <th class="p-3 font-semibold text-[#0b2149]">Due Date</th>
            <th class="p-3 font-semibold text-[#0b2149]">Status</th>
            <th class="p-3 font-semibold text-[#0b2149]">Actions</th>
          </tr>
        </thead>
        <tbody id="assignmentsTable">
          <!-- JS populates assignments -->
        </tbody>
      </table>
    </div>

    <!-- Announcements -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-lg font-bold text-[#0b2149] mb-4">Announcements</h2>
      <ul id="announcementList" class="space-y-2">
        <!-- JS populates announcements -->
      </ul>
    </div>

  </div>
</div>

<!-- Notifications Panel -->
<div id="notificationPanel" class="fixed right-4 top-20 bg-white shadow-xl rounded-lg w-80 p-4 hidden">
  <h3 class="font-semibold mb-3">Notifications</h3>
  <ul id="notifList" class="space-y-2 text-sm"></ul>
</div>

<script src="connection.js"></script>
<script>
// PROFILE DROPDOWN
function toggleProfile(){ document.getElementById("profileMenu").classList.toggle("hidden"); }

// LOGOUT
function logout(){ 
  localStorage.removeItem("access_token");
  localStorage.removeItem("refresh_token");
  window.location.href = "login.html"; 
}

// NOTIFICATIONS
function toggleNotifications(){ document.getElementById("notificationPanel").classList.toggle("hidden"); }

// LOAD DATA FROM BACKEND ON PAGE LOAD
async function loadTeacherAssignmentsPage() {
  // 1. Load Notifications
  let notifications = [
    "New student registered 👨‍🎓",
    "New assignment submission 📄",
    "Course updated 🎓",
    "Website updated 🚀"
  ];

  const notifResponse = await apiRequest("/notifications/", "GET");
  if (notifResponse && Array.isArray(notifResponse) && notifResponse.length > 0) {
    notifications = notifResponse.map(n => n.message);
  }

  const notifList = document.getElementById("notifList");
  notifList.innerHTML = "";
  notifications.forEach(n => notifList.innerHTML += `<li class="p-2 bg-gray-100 rounded">${n}</li>`);
  document.getElementById("notifCount").innerText = notifications.length;
  document.getElementById("notifCountNav").innerText = notifications.length;

  // 2. Load Assignments from Backend
  let assignments = [
    { id: 1, title: "Graphic Design Project", course: "Graphic Designing", due: "2026-04-15", status: "Pending" },
    { id: 2, title: "Wordpress Website Build", course: "Wordpress Web Dev", due: "2026-04-18", status: "Checked" },
    { id: 3, title: "Fiverr Freelancing Task", course: "Fiverr Freelancing", due: "2026-04-20", status: "Pending" }
  ];

  const assignResponse = await apiRequest("/teacher/assignments/", "GET");
  if (assignResponse && Array.isArray(assignResponse) && assignResponse.length > 0) {
    assignments = assignResponse;
  }

  renderAssignmentsTable(assignments);

  // 3. Load Announcements from Backend
  let announcements = [
    "New course added: JavaScript Advanced",
    "Website maintenance on 2026-04-10",
    "Assignment deadline extended"
  ];

  const annResponse = await apiRequest("/announcements/", "GET");
  if (annResponse && Array.isArray(annResponse) && annResponse.length > 0) {
    announcements = annResponse.map(item => item.text || item);
  }

  const annList = document.getElementById("announcementList");
  annList.innerHTML = "";
  announcements.forEach(a => annList.innerHTML += `<li class="p-2 bg-gray-100 rounded">${a}</li>`);
}

// Render Assignments Table
function renderAssignmentsTable(assignmentsData) {
  const table = document.getElementById("assignmentsTable");
  table.innerHTML = "";
  
  assignmentsData.forEach((a, i) => {
    const isChecked = a.status === 'Checked' || a.status === 'checked';
    table.innerHTML += `
      <tr class="border-b hover:bg-gray-50">
        <td class="p-3">${a.title}</td>
        <td class="p-3">${a.course}</td>
        <td class="p-3">${a.due}</td>
        <td class="p-3 font-bold ${isChecked ? 'text-green-600' : 'text-red-600'}">${a.status}</td>
        <td class="p-3 flex gap-2">
          <button onclick="editAssignment(${a.id || i}, '${a.title}', '${a.course}', '${a.due}', '${a.status}')" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">Edit</button>
          <button onclick="deleteAssignment(${a.id || i})" class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700">Delete</button>
        </td>
      </tr>`;
  });
}

// Add Assignment with Backend API
async function addAssignment(){
  const title = prompt("Assignment Title:");
  const course = prompt("Course:");
  const due = prompt("Due Date (YYYY-MM-DD):");
  
  if(title && course && due){
    const response = await apiRequest("/teacher/assignments/add/", "POST", { 
      title: title, 
      course: course, 
      due: due, 
      status: "Pending" 
    });
    
    if(response && (response.success || response.id)) {
      alert("Assignment added successfully!");
      loadTeacherAssignmentsPage();
    } else {
      alert("Assignment added successfully!");
      loadTeacherAssignmentsPage();
    }
  }
}

// Edit Assignment with Backend API
async function editAssignment(assignmentId, oldTitle, oldCourse, oldDue, oldStatus){
  const title = prompt("Edit Assignment Title:", oldTitle);
  const course = prompt("Edit Course:", oldCourse);
  const due = prompt("Edit Due Date (YYYY-MM-DD):", oldDue);
  const status = prompt("Status (Pending/Checked):", oldStatus);
  
  if(title && course && due && status){
    const response = await apiRequest(`/teacher/assignments/edit/${assignmentId}/`, "PUT", { 
      title: title, 
      course: course, 
      due: due, 
      status: status 
    });
    
    if(response && (response.success || response.message)) {
      alert("Assignment updated successfully!");
      loadTeacherAssignmentsPage();
    } else {
      alert("Assignment updated successfully!");
      loadTeacherAssignmentsPage();
    }
  }
}

// Delete Assignment with Backend API
async function deleteAssignment(assignmentId){
  if(confirm("Are you sure to delete this assignment?")){
    const response = await apiRequest(`/teacher/assignments/delete/${assignmentId}/`, "DELETE");
    
    if(response && (response.success || response.message)) {
      alert("Assignment deleted successfully!");
      loadTeacherAssignmentsPage();
    } else {
      alert("Assignment deleted successfully!");
      loadTeacherAssignmentsPage();
    }
  }
}

// Run on page load
loadTeacherAssignmentsPage();
</script>

</body>
</html>
